name: Study1 V2 Google-login-only public browse safety (CI, no deploy)
on:
  push:
    branches: [main]
    paths:
      - 'gas/**'
      - 'scripts/study1-v2-gas-head-only.cjs'
      - 'tests/closed.test.cjs'
      - 'tests/study1-v2-public-readonly.test.cjs'
      - 'tests/study1-formal-browser-synthetic-e2e.test.cjs'
      - 'tests/study1-participant-intake.test.cjs'
      - 'tests/study1-formal-notifications-outbox.test.cjs'
      - 'tests/study1-formal-v05-v08-original-booking.test.cjs'
      - 'tests/study1-formal-v05-v08-browser-e2e.test.cjs'
      - 'tests/study1-admin-sandbox.test.cjs'
      - 'tests/study1-signed-pdf-record.test.cjs'
      - 'tests/study1-owner-presigned-pdf-ui.test.cjs'
      - 'tests/study1-formal-consent-bridge.test.cjs'
      - 'tests/study1-econsent-registry-v2.test.cjs'
      - 'tests/study1-pdf-stamp-core.test.cjs'
      - 'tests/study1-signed-pdf-wizard-readback.test.cjs'
      - 'tests/study1-admin-console-interaction.test.cjs'
      - 'tests/study1-owner-formal-consent-booking-audit.test.cjs'
      - 'tests/study1-rec-202604EM033-authority.test.cjs'
      - '.github/workflows/study1-v2-public-readonly-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline syntax and deny-all-public-RPC checks
        env:
          STUDY1_V2_GAS_FIXTURE_DIR: gas
        run: |
          for f in gas/*.js; do node --check "$f"; done
          node --check scripts/study1-v2-gas-head-only.cjs
          node --test tests/study1-v2-public-readonly.test.cjs tests/closed.test.cjs tests/study1-v2-gas-head-only.test.cjs tests/study1-formal-browser-synthetic-e2e.test.cjs tests/study1-participant-intake.test.cjs tests/study1-formal-notifications-outbox.test.cjs tests/study1-formal-v05-v08-original-booking.test.cjs tests/study1-formal-v05-v08-browser-e2e.test.cjs tests/study1-admin-sandbox.test.cjs tests/study1-signed-pdf-record.test.cjs tests/study1-owner-presigned-pdf-ui.test.cjs tests/study1-formal-consent-bridge.test.cjs tests/study1-econsent-registry-v2.test.cjs tests/study1-pdf-stamp-core.test.cjs tests/study1-signed-pdf-wizard-readback.test.cjs tests/study1-admin-console-interaction.test.cjs tests/study1-owner-formal-consent-booking-audit.test.cjs tests/study1-rec-202604EM033-authority.test.cjs
