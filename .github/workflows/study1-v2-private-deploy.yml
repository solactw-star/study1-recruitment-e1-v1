          V2_PUBLIC_RESUME: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-public-release.cjs audit
      - name: Remove local encrypted backups
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/study1-v2-public-prewrite-43711280217.json.enc"
          rm -f "$RUNNER_TEMP/study1-v2-public-prewrite-$GITHUB_RUN_ID.json.enc"
  anonymous-readonly-approved-once:
    if: >-
      ${{ github.event_name == 'push' && github.repository == 'solactw-star/study1-recruitment-e1-v1'
      && github.ref == 'refs/heads/main' && github.event.before == '17a4da5df8614305736d7e7a8a4169ed794ffa74'
      && github.event.head_commit.message == 'release-v2 authorized anonymous closed public entry 2026-11-16' && github.run_attempt == 1 }}
    needs: automatic-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full same-checkout public and private tests without credentials
        env:
          STUDY1_V2_GAS_FIXTURE_DIR: gas
          V2_PRIVATE_TEST_MODE: 'true'
        run: |
          for f in gas/*.js; do node --check "$f"; done
          for f in tests/fixtures/legacy-gas/*.js; do node --check "$f"; done
          node --check scripts/study1-v2-gas-head-only.cjs
          node --test tests/study1-v2-recruitment-copy.test.cjs tests/study1-v2-public-readonly.test.cjs tests/closed.test.cjs tests/study1-v2-gas-head-only.test.cjs tests/study1-formal-browser-synthetic-e2e.test.cjs tests/study1-participant-intake.test.cjs tests/study1-self-report-authority.test.cjs tests/otp.test.cjs tests/otp-throttle.test.cjs tests/study1-formal-notifications-outbox.test.cjs tests/study1-owner-e1-operations-audit.test.cjs tests/study1-e1-lost-browser-capability-guard.test.cjs tests/study1-formal-v05-v08-original-booking.test.cjs tests/study1-formal-v05-v08-browser-e2e.test.cjs tests/study1-admin-sandbox.test.cjs tests/study1-signed-pdf-record.test.cjs tests/study1-owner-presigned-pdf-ui.test.cjs tests/study1-formal-consent-bridge.test.cjs tests/study1-econsent-registry-v2.test.cjs tests/study1-pdf-stamp-core.test.cjs tests/study1-signed-pdf-wizard-readback.test.cjs tests/study1-formal-intake-wizard.test.cjs tests/study1-legacy-quarantine.test.cjs tests/study1-unified-transaction-adapter.test.cjs tests/study1-admin-console-interaction.test.cjs tests/study1-owner-formal-consent-booking-audit.test.cjs tests/study1-rec-202604EM033-authority.test.cjs
          node --check scripts/study1-v2-private-deploy.cjs
          node --test tests/study1-v2-private-deploy.test.cjs tests/study1-v2-gas-head-only.test.cjs tests/closed.test.cjs tests/study1-v2-anonymous-release.test.cjs
      - name: Preserve reviewed public release baseline (GET only)
        env:
          V2_ANONYMOUS_RELEASE: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-anonymous-release.cjs prepare
      - name: Upload encrypted prewrite backup
        uses: actions/upload-artifact@v4
        with:
          name: study1-v2-anonymous-prewrite-${{ github.run_id }}
          path: ${{ runner.temp }}/study1-v2-anonymous-prewrite-${{ github.run_id }}.json.enc
          if-no-files-found: error
          retention-days: 7
      - name: Publish the authorized anonymous closed version once
        env:
          V2_ANONYMOUS_RELEASE: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-anonymous-release.cjs apply
      - name: GET-only reconciliation on uncertain outcome
        if: failure()
        env:
          V2_ANONYMOUS_RELEASE: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-anonymous-release.cjs audit
      - name: Remove local encrypted backup
        if: always()
        run: rm -f "$RUNNER_TEMP/study1-v2-anonymous-prewrite-$GITHUB_RUN_ID.json.enc"
