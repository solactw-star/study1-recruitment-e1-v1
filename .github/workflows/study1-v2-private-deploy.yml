name: Study1 V2 PRIVATE MYSELF inventory (auto GET) and deploy (manual only)
# Main push: GET-only audit. All mutation phases remain separate manual jobs.
on:
  push:
    branches: [main]
    paths:
      - 'gas/**'
      - 'scripts/study1-v2-gas-head-only.cjs'
      - 'scripts/study1-v2-private-deploy.cjs'
      - '.github/workflows/study1-v2-private-deploy.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit: GET only; version: create one immutable version; deploy: deploy an existing audited version'
        type: choice
        required: true
        options: [audit, version, deploy]
        default: audit
      reviewed_sha:
        description: 'Exact current V2 main 40-character commit SHA'
        type: string
        required: true
      reviewed_target_sha256:
        description: 'Exact reviewed private E1 management candidate SHA-256'
        required: true
        type: string
      private_version:
        description: 'Deploy only: explicit verified immutable version number'
        required: false
        type: string
      expected_inventory_sha256:
        description: 'version/deploy: V2_PRIVATE_INVENTORY_SHA256 from separate successful audit'
        type: string
        required: false
      confirmation:
        description: 'version: I_AUTHORIZE_STUDY1_V2_PRIVATE_E1_VERSION; deploy: I_AUTHORIZE_STUDY1_V2_PRIVATE_MYSELF_DEPLOY'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  # Prevent overlap with V2 HEAD source synchronization.
  group: study1-v2-gas-head-only
  cancel-in-progress: false
jobs:
  automatic-inventory:
    if: ${{ github.event_name == 'push' && github.repository == 'solactw-star/study1-recruitment-e1-v1' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and audit safety tests (no credentials)
        env:
          V2_PRIVATE_TEST_MODE: 'true'
        run: node --test tests/study1-v2-private-deploy.test.cjs tests/study1-v2-gas-head-only.test.cjs tests/closed.test.cjs
      - name: Automatic V2 inventory (project GET only)
        env:
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-private-deploy.cjs auto-audit
  private-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'solactw-star/study1-recruitment-e1-v1' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static/synthetic tests (no GAS API mutations)
        env:
          V2_PRIVATE_TEST_MODE: 'true'
        run: |
          node --check scripts/study1-v2-private-deploy.cjs
          node --test tests/study1-v2-private-deploy.test.cjs tests/study1-v2-gas-head-only.test.cjs tests/closed.test.cjs
      - name: Exact V2 main, manual-only, and deploy input guard
        env:
          PRIVATE_MODE: ${{ inputs.mode }}
          REVIEWED_TARGET_SHA256: ${{ inputs.reviewed_target_sha256 }}
          PRIVATE_VERSION: ${{ inputs.private_version }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          EXPECTED_INVENTORY_SHA256: ${{ inputs.expected_inventory_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REPOSITORY" = solactw-star/study1-recruitment-e1-v1
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_SHA" = "$REVIEWED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          [[ "$REVIEWED_TARGET_SHA256" =~ ^[a-f0-9]{64}$ ]]
          if [ "$PRIVATE_MODE" = deploy ]; then
            test "$CONFIRMATION" = I_AUTHORIZE_STUDY1_V2_PRIVATE_MYSELF_DEPLOY
            [[ "$PRIVATE_VERSION" =~ ^[1-9][0-9]*$ ]]
            [[ "$EXPECTED_INVENTORY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          elif [ "$PRIVATE_MODE" = version ]; then
            test "$CONFIRMATION" = I_AUTHORIZE_STUDY1_V2_PRIVATE_E1_VERSION
            [[ "$EXPECTED_INVENTORY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          else
            test "$PRIVATE_MODE" = audit
          fi
      - name: V2-only read-only inventory audit
        if: ${{ inputs.mode == 'audit' }}
        env:
          PRIVATE_MODE: ${{ inputs.mode }}
          REVIEWED_TARGET_SHA256: ${{ inputs.reviewed_target_sha256 }}
          PRIVATE_VERSION: ${{ inputs.private_version }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          EXPECTED_INVENTORY_SHA256: ${{ inputs.expected_inventory_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-private-deploy.cjs audit
      - name: Prepare authenticated private release inventory backup (GET only)
        if: ${{ inputs.mode != 'audit' }}
        env:
          PRIVATE_MODE: ${{ inputs.mode }}
          REVIEWED_TARGET_SHA256: ${{ inputs.reviewed_target_sha256 }}
          PRIVATE_VERSION: ${{ inputs.private_version }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          EXPECTED_INVENTORY_SHA256: ${{ inputs.expected_inventory_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-private-deploy.cjs prepare
      - name: Preserve encrypted private release backup (ciphertext ONLY)
        if: ${{ inputs.mode != 'audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: study1-v2-private-prewrite-${{ github.run_id }}
          path: ${{ runner.temp }}/study1-v2-private-prewrite-${{ github.run_id }}.json.enc
          if-no-files-found: error
          retention-days: 7
      - name: Independently confirmed version OR deployment; validate backup and read back
        if: ${{ inputs.mode != 'audit' }}
        env:
          PRIVATE_MODE: ${{ inputs.mode }}
          REVIEWED_TARGET_SHA256: ${{ inputs.reviewed_target_sha256 }}
          PRIVATE_VERSION: ${{ inputs.private_version }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          EXPECTED_INVENTORY_SHA256: ${{ inputs.expected_inventory_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-private-deploy.cjs "$PRIVATE_MODE"
      - name: Purge ephemeral encrypted release backup
        if: always()
        run: rm -f "$RUNNER_TEMP/study1-v2-private-prewrite-$GITHUB_RUN_ID.json.enc"
  private-version2-resume:
    if: >-
      ${{ github.event_name == 'push' && github.repository == 'solactw-star/study1-recruitment-e1-v1'
      && github.ref == 'refs/heads/main' && github.event.before == '4f500f4b923d76db58a7194f42162f9e85e1ca22'
      && github.event.head_commit.message == 'release-v2 authorized resume private version 2 deployment 2026-11-15' && github.run_attempt == 1 }}
    needs: automatic-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare existing version 2 deployment backup (GET only)
        env:
          V2_ONCE_RELEASE: '1'
          V2_RESUME_DEPLOY: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-private-deploy.cjs resume-prepare
      - name: Preserve encrypted deployment backup before POST
        uses: actions/upload-artifact@v4
        with:
          name: study1-v2-resume-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/study1-v2-private-prewrite-${{ github.run_id }}-deploy.json.enc
          if-no-files-found: error
          retention-days: 7
      - name: Deploy existing version 2 once and verify
        env:
          V2_ONCE_RELEASE: '1'
          V2_RESUME_DEPLOY: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-private-deploy.cjs resume-deploy
      - name: Read-only reconcile if deployment fails (no repeat)
        if: failure()
        env:
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-private-deploy.cjs auto-audit
      - name: Purge local encrypted backup
        if: always()
        run: rm -f "$RUNNER_TEMP/study1-v2-private-prewrite-$GITHUB_RUN_ID-deploy.json.enc"
  private-approved-once:
    if: >-
      ${{ github.event_name == 'push' && github.repository == 'solactw-star/study1-recruitment-e1-v1'
      && github.ref == 'refs/heads/main' && github.event.before == 'e6020f1b4d9e51c669409c8ddd4fadc69db34c66'
      && github.event.head_commit.message == 'release-v2 authorized one-time private E1 OWNER launch 2026-11-15' && github.run_attempt == 1 }}
    needs: automatic-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full same-checkout public and private safety tests (no credentials)
        env:
          STUDY1_V2_GAS_FIXTURE_DIR: gas
