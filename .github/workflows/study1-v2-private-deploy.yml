        env:
          V2_PUBLIC_RELEASE: '1'
          V2_PUBLIC_RESUME: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-public-release.cjs resume-apply
