          node --test tests/study1-v2-public-readonly.test.cjs tests/closed.test.cjs tests/study1-v2-gas-head-only.test.cjs tests/study1-formal-browser-synthetic-e2e.test.cjs tests/study1-participant-intake.test.cjs tests/study1-self-report-authority.test.cjs tests/otp.test.cjs tests/otp-throttle.test.cjs tests/study1-formal-notifications-outbox.test.cjs tests/study1-owner-e1-operations-audit.test.cjs tests/study1-e1-lost-browser-capability-guard.test.cjs tests/study1-formal-v05-v08-original-booking.test.cjs tests/study1-formal-v05-v08-browser-e2e.test.cjs tests/study1-admin-sandbox.test.cjs tests/study1-signed-pdf-record.test.cjs tests/study1-owner-presigned-pdf-ui.test.cjs tests/study1-formal-consent-bridge.test.cjs tests/study1-econsent-registry-v2.test.cjs tests/study1-pdf-stamp-core.test.cjs tests/study1-signed-pdf-wizard-readback.test.cjs tests/study1-formal-intake-wizard.test.cjs tests/study1-legacy-quarantine.test.cjs tests/study1-unified-transaction-adapter.test.cjs tests/study1-admin-console-interaction.test.cjs tests/study1-owner-formal-consent-booking-audit.test.cjs tests/study1-rec-202604EM033-authority.test.cjs
          node --check scripts/study1-v2-private-deploy.cjs
          node --test tests/study1-v2-private-deploy.test.cjs tests/study1-v2-gas-head-only.test.cjs tests/closed.test.cjs
      - name: Prepare HEAD encrypted backup (GET only)
        env:
          V2_ONCE_RELEASE: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-private-deploy.cjs once-head-prepare
      - name: Preserve HEAD encrypted backup before mutation
        uses: actions/upload-artifact@v4
        with:
          name: study1-v2-once-head-${{ github.run_id }}
          path: ${{ runner.temp }}/study1-v2-prewrite-${{ github.run_id }}.json.enc
          if-no-files-found: error
          retention-days: 7
      - name: Execute authorized HEAD once and verify readback
        env:
          V2_ONCE_RELEASE: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-private-deploy.cjs once-head-apply
      - name: Prepare immutable version encrypted backup (GET only)
        env:
          V2_ONCE_RELEASE: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-private-deploy.cjs once-version-prepare
      - name: Preserve immutable version encrypted backup before mutation
        uses: actions/upload-artifact@v4
        with:
          name: study1-v2-once-version-${{ github.run_id }}
          path: ${{ runner.temp }}/study1-v2-private-prewrite-${{ github.run_id }}-version.json.enc
          if-no-files-found: error
          retention-days: 7
      - name: Execute authorized immutable version once and verify readback
        env:
          V2_ONCE_RELEASE: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-private-deploy.cjs once-version-apply
      - name: Prepare private deployment encrypted backup (GET only)
        env:
          V2_ONCE_RELEASE: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-private-deploy.cjs once-deploy-prepare
      - name: Preserve private deployment encrypted backup before mutation
        uses: actions/upload-artifact@v4
        with:
          name: study1-v2-once-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/study1-v2-private-prewrite-${{ github.run_id }}-deploy.json.enc
          if-no-files-found: error
          retention-days: 7
      - name: Execute authorized private deployment once and verify readback
        env:
          V2_ONCE_RELEASE: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-private-deploy.cjs once-deploy-apply
      - name: Read-only reconcile after any failed stage (never repeat mutation)
        if: failure()
        env:
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-private-deploy.cjs auto-audit
      - name: Purge local encrypted backup and stage state
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/study1-v2-prewrite-$GITHUB_RUN_ID.json.enc"
          rm -f "$RUNNER_TEMP/study1-v2-head-state-$GITHUB_RUN_ID.json"
          rm -f "$RUNNER_TEMP/study1-v2-private-prewrite-$GITHUB_RUN_ID-version.json.enc" "$RUNNER_TEMP/study1-v2-private-prewrite-$GITHUB_RUN_ID-deploy.json.enc"
          rm -f "$RUNNER_TEMP/study1-v2-once-$GITHUB_RUN_ID-"*.json
  public-readonly-approved-once:
    if: >-
      ${{ github.event_name == 'push' && github.repository == 'solactw-star/study1-recruitment-e1-v1'
      && github.ref == 'refs/heads/main' && github.event.before == 'e1b75093d98a56c00f4c941da234703179736a5f'
      && github.event.head_commit.message == 'release-v2 authorized public login-only browse correction 2026-11-15' && github.run_attempt == 1 }}
    needs: automatic-inventory
