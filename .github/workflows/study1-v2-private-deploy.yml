        uses: actions/download-artifact@v4
        with:
          name: study1-v2-public-prewrite-43711280217
          run-id: 43711280217
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}
      - name: Verify original private inventory and existing public version 3 (GET only)
        env:
          V2_PUBLIC_RELEASE: '1'
          V2_PUBLIC_RESUME: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-public-release.cjs resume-prepare
      - name: Preserve encrypted current deployment baseline
        uses: actions/upload-artifact@v4
        with:
          name: study1-v2-public-resume-prewrite-${{ github.run_id }}
          path: ${{ runner.temp }}/study1-v2-public-prewrite-${{ github.run_id }}.json.enc
          if-no-files-found: error
          retention-days: 7
