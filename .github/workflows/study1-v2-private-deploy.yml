          node --check scripts/study1-v2-private-deploy.cjs
          node --test tests/study1-v2-private-deploy.test.cjs tests/study1-v2-gas-head-only.test.cjs tests/closed.test.cjs
      - name: Preserve reviewed public release baseline (GET only)
        env:
          V2_PUBLIC_RELEASE: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-public-release.cjs prepare
      - name: Upload encrypted prewrite backup
        uses: actions/upload-artifact@v4
        with:
          name: study1-v2-public-prewrite-${{ github.run_id }}
          path: ${{ runner.temp }}/study1-v2-public-prewrite-${{ github.run_id }}.json.enc
          if-no-files-found: error
          retention-days: 7
      - name: Publish the authorized closed public version once
        env:
          V2_PUBLIC_RELEASE: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-public-release.cjs apply
      - name: GET-only reconciliation on uncertain outcome
        if: failure()
        env:
          V2_PUBLIC_RELEASE: '1'
          V2_GAS_CLASPRC_JSON: ${{ secrets.V2_GAS_CLASPRC_JSON }}
        run: node scripts/study1-v2-public-release.cjs audit
      - name: Remove local encrypted backup
        if: always()
        run: rm -f "$RUNNER_TEMP/study1-v2-public-prewrite-$GITHUB_RUN_ID.json.enc"
  public-version3-resume:
    if: >-
      ${{ github.event_name == 'push' && github.repository == 'solactw-star/study1-recruitment-e1-v1'
      && github.ref == 'refs/heads/main' && github.event.before == 'b2e63c0109cb90c21bb0df04c76dcb78f09ae2ad'
      && github.event.head_commit.message == 'release-v2 authorized public version 3 deployment resume 2026-11-15' && github.run_attempt == 1 }}
